services:
  n8n:
    image: docker.n8n.io/n8nio/n8n
    container_name: n8n-local
    restart: unless-stopped
    ports:
      # 127.0.0.1 に限定し、同じPCからだけアクセスできるようにする（外部には公開しない）
      - "127.0.0.1:5678:5678"
    environment:
      - TZ=Asia/Tokyo
      - GENERIC_TIMEZONE=Asia/Tokyo
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
    volumes:
      - n8n_data:/home/node/.n8n

volumes:
  n8n_data:
    name: n8n_data
